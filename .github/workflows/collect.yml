name: Collect Rome GBFS
on:
  schedule:
    - cron: "*/15 * * * *"     # ogni 15 min (best-effort)
  workflow_dispatch: {}        # pulsante "Run workflow" per test manuali
permissions:
  contents: write              # per poter fare push dei dati
concurrency:
  group: collect               # mai due poll insieme
  cancel-in-progress: false
jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install --quiet requests pandas pyarrow
      - run: python poll.py
      - name: Commit new snapshots
        run: |
          git config user.name "gbfs-bot"
          git config user.email "gbfs-bot@users.noreply.github.com"
          git add snapshots
          if git diff --cached --quiet; then echo "no new data"; else
            git commit -m "snapshot $(date -u +%FT%TZ)"
            git pull --rebase --autostash
            git push
          fi
